# cargo-deny policy, run by the pre-push gate:
#   cargo deny check bans licenses sources
#   cargo deny check advisories

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only. A copyleft entry (GPL, AGPL, LGPL) is a licensing
# decision for the project owner, not a dependency bump.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
exceptions = []
# This crate is `publish = false` and carries no license yet.
private = { ignore = true }

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Unmaintained, not vulnerable: a proc-macro pulled in by netlink-packet-core
    # through libp2p-quic/libp2p-tcp -> if-watch (Linux). Drop this entry once
    # libp2p no longer depends on it.
    { id = "RUSTSEC-2024-0436", reason = "transitive via libp2p (if-watch), no maintained alternative upstream" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
